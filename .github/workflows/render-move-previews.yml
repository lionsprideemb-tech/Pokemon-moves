name: Render HG donor animation previews

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Zero-based preview row to start at"
        required: false
        default: "0"
      count:
        description: "Number of unique DS animations to render"
        required: false
        default: "5"


permissions:
  contents: write

concurrency:
  group: render-move-animation-previews
  cancel-in-progress: true

env:
  CC: gcc-10
  CXX: g++-10
  COMPARE: 0
  SDL_VIDEODRIVER: dummy
  PREVIEW_START: ${{ github.event.inputs.start || '0' }}
  PREVIEW_COUNT: ${{ github.event.inputs.count || '5' }}
  HG_ENGINE_COMMIT: "398a3020943f1ae98987e5b12b73d9086bbba3ce"
  POKEHEARTGOLD_COMMIT: "9d8b7591f09b65804da2fb2dfd56f320633e0d36"

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout preview library
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and capture dependencies
        shell: bash
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt -y --allow-downgrades install \
            g++-10-multilib linux-libc-dev binutils-arm-none-eabi p7zip-full \
            pkg-config libpugixml-dev libpng-dev build-essential cmake \
            python3-pip python3-venv git automake autoconf gcc-arm-none-eabi \
            wget ffmpeg
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -q -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo add-apt-repository ppa:cybermax-dexter/sdl2-backport -y
          sudo wget -q -NP /etc/apt/sources.list.d/ "https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources"
          sudo apt update
          sudo apt -y --allow-downgrades install --install-recommends winehq-stable

      - name: Checkout pinned pokeheartgold
        shell: bash
        run: |
          git clone https://github.com/pret/pokeheartgold.git vendor/pokeheartgold
          git -C vendor/pokeheartgold checkout "$POKEHEARTGOLD_COMMIT"

      - name: Bootstrap pokeheartgold toolchain
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools"
          mkdir -p "$GITHUB_WORKSPACE/vendor/pokeheartgold/sub"
          mkdir -p "$RUNNER_TEMP/phg-download"
          cd "$RUNNER_TEMP/phg-download"

          wget -q https://github.com/pret/pokeheartgold/raw/workflows/assets/mwccarm.zip
          unzip -q -o mwccarm.zip
          rm -rf "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/mwccarm"
          mv mwccarm "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/"

          wget -q https://github.com/pret/pokeheartgold/raw/workflows/assets/NitroSDK-3_2-060901.7z
          7z x -y NitroSDK-3_2-060901.7z >/dev/null
          rm -rf "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/bin"
          mv NitroSDK-3_2-060901/tools/bin "$GITHUB_WORKSPACE/vendor/pokeheartgold/tools/"
          cp NitroSDK-3_2-060901/include/nitro/specfiles/ARM7-TS.lcf.template "$GITHUB_WORKSPACE/vendor/pokeheartgold/sub/"
          cp NitroSDK-3_2-060901/include/nitro/specfiles/ARM9-TS.lcf.template "$GITHUB_WORKSPACE/vendor/pokeheartgold/"
          cp NitroSDK-3_2-060901/include/nitro/specfiles/mwldarm.response.template "$GITHUB_WORKSPACE/vendor/pokeheartgold/"

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 19

      - name: Build HeartGold base from source
        working-directory: vendor/pokeheartgold
        env:
          LM_LICENSE_FILE: "${{ github.workspace }}/vendor/pokeheartgold/tools/mwccarm/license.dat"
          GAME_VERSION: HEARTGOLD
          GAME_LANGUAGE: ENGLISH
          GAME_REVISION: 0
        shell: bash
        run: make -j"$(nproc)"

      - name: Checkout pinned HG-Engine
        shell: bash
        run: |
          git clone --recursive https://github.com/BluRosie/hg-engine.git vendor/hg-engine
          git -C vendor/hg-engine checkout "$HG_ENGINE_COMMIT"
          git -C vendor/hg-engine submodule update --init --recursive

      - name: Generate preview battle tests
        shell: bash
        run: |
          python3 scripts/generate_preview_tests.py \
            --render-manifest docs/approval/manifests/preview_render_manifest.csv \
            --moves-manifest manifests/moves.csv \
            --hg-engine vendor/hg-engine \
            --start "$PREVIEW_START" \
            --count "$PREVIEW_COUNT"
          cat vendor/hg-engine/preview_selection.csv

      - name: Prepare HG-Engine inputs
        shell: bash
        run: |
          cp vendor/pokeheartgold/build/heartgold.us/pokeheartgold.us.nds vendor/hg-engine/rom.nds
          wget -q https://github.com/BluRosie/hg-engine/raw/workflows/assets/test.sav -O vendor/hg-engine/test.sav

      - name: Build preview test ROM
        working-directory: vendor/hg-engine
        shell: bash
        run: |
          unset CC
          unset CXX
          make AUTO_TEST=Y -j"$(nproc)"

      - name: Capture DS animation videos
        working-directory: vendor/hg-engine
        shell: bash
        run: |
          .venv/bin/python "$GITHUB_WORKSPACE/scripts/capture_preview_tests.py" \
            --out-dir "$GITHUB_WORKSPACE/docs/approval/previews/mp4" \
            --fps 30 \
            --sample-every 2

      - name: Rebuild approval preview index
        shell: bash
        run: |
          python3 scripts/build_preview_index.py \
            --mapping docs/approval/manifests/preview_move_mapping.csv \
            --preview-root docs/approval/previews \
            --output docs/approval/previews.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/approval/previews.json")
          d = json.loads(p.read_text())
          mp4s = sorted(Path("docs/approval/previews/mp4").glob("*.mp4"))
          print("Rendered MP4 files:", len(mp4s))
          print("Moves now previewable:", d.get("rendered_move_count", 0))
          if not mp4s:
              raise SystemExit("No MP4 previews were rendered")
          PY

      - name: Upload proof batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: move-animation-preview-${{ env.PREVIEW_START }}-${{ env.PREVIEW_COUNT }}
          path: |
            docs/approval/previews/mp4/*.mp4
            docs/approval/previews.json
            vendor/hg-engine/preview_selection.csv
          if-no-files-found: error

      - name: Commit rendered previews to approval page
        shell: bash
        run: |
          git config user.name "pokemon-moves-preview-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/approval/previews/mp4 docs/approval/previews.json
          if git diff --cached --quiet; then
            echo "No new preview files to commit."
            exit 0
          fi
          git commit -m "Render DS move animation preview batch ${PREVIEW_START}+${PREVIEW_COUNT}"
          git pull --rebase origin main
          git push origin HEAD:main
