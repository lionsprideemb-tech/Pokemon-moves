name: Sync modern DS moves from hg-engine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-modern-moves.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout library
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned hg-engine
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hg-engine
          git clone --filter=blob:none https://github.com/BluRosie/hg-engine.git /tmp/hg-engine
          git -C /tmp/hg-engine checkout 398a3020943f1ae98987e5b12b73d9086bbba3ce

      - name: Collect modern move source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p animations/hg-engine
          mkdir -p move_scripts/hg-engine
          mkdir -p move_data/hg-engine
          mkdir -p references/hg-engine

          for id in $(seq 471 922); do
            anim="/tmp/hg-engine/armips/move/move_anim/${id}.s"
            test -f "$anim"
            cp "$anim" "animations/hg-engine/${id}.s"

            n=$(printf "%04d" "$id")
            matches=(/tmp/hg-engine/data/battle_scripts/moves/move_script_${n}_*.s)
            test -f "${matches[0]}"
            cp "${matches[0]}" move_scripts/hg-engine/
          done

          cp /tmp/hg-engine/data/Moves.c move_data/hg-engine/Moves.c
          cp /tmp/hg-engine/armips/asm/moves.s references/hg-engine/armips_moves.s
          cp /tmp/hg-engine/include/constants/moves.h references/hg-engine/moves.h
          cp /tmp/hg-engine/include/constants/move_effects.h references/hg-engine/move_effects.h
          cp /tmp/hg-engine/armips/include/animscriptcmd.s support/animscriptcmd.s
          cp /tmp/hg-engine/CREDITS.md CREDITS_HG_ENGINE.md

      - name: Verify coverage
        shell: bash
        run: |
          set -euo pipefail
          anim_count=$(find animations/hg-engine -maxdepth 1 -type f -name '*.s' | wc -l)
          script_count=$(find move_scripts/hg-engine -maxdepth 1 -type f -name 'move_script_*.s' | wc -l)
          test "$anim_count" -eq 452
          test "$script_count" -eq 452
          for id in $(seq 471 922); do
            test -f "animations/hg-engine/${id}.s"
            n=$(printf "%04d" "$id")
            compgen -G "move_scripts/hg-engine/move_script_${n}_*.s" >/dev/null
          done
          echo "Verified 452/452 animations and 452/452 move scripts."

      - name: Commit synced source
        shell: bash
        run: |
          set -euo pipefail
          git add animations/hg-engine move_scripts/hg-engine move_data/hg-engine references/hg-engine support/animscriptcmd.s CREDITS_HG_ENGINE.md
          if git diff --cached --quiet; then
            echo "Already synchronized."
            exit 0
          fi
          git config user.name "Mercury Redux Library Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Sync complete modern DS move and animation source"
          git push
